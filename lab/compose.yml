# A deliberately misconfigured Odoo, for testing odoo-doctor. Never expose it.
# Usage: ODOO_VERSION=19 LAB_PORT=18019 docker compose -p oddoc-lab-19 -f lab/compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    image: odoo:${ODOO_VERSION:-19}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAB_PORT:-18019}:8069"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons:ro

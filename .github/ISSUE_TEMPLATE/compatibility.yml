name: Compatibility report
description: Tell us how odoo-doctor behaved on your Odoo, even if everything worked.
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Reports that say "it worked" are just as useful as failures. We most need Odoo.sh, Odoo Online, Odoo on Windows and large databases.

        **This issue is public.** Reports can contain logins, database names and details of a system's weaknesses. Run with `--redact`, and only paste what you are happy to publish. Do not paste passwords, API keys or a whole report.
  - type: dropdown
    id: environment
    attributes:
      label: Where does this Odoo run?
      options:
        - Odoo.sh
        - Odoo Online
        - Windows, native install
        - Linux, native install
        - Docker
        - Docker over SSH
        - Other
    validations:
      required: true
  - type: dropdown
    id: odoo-version
    attributes:
      label: Odoo version
      options:
        - "20"
        - "19"
        - "18"
        - "17"
        - Older
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked, and the findings look right
        - Worked, but some findings look wrong
        - Some areas could not be checked
        - It failed
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: odoo-doctor version
      description: The output of `odoo-doctor --version`.
    validations:
      required: true
  - type: input
    id: tool-system
    attributes:
      label: System running odoo-doctor
      placeholder: Windows 11 ARM64, Ubuntu 24.04 x86-64, macOS 15...
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Replace addresses and keys with placeholders.
      placeholder: odoo-doctor --ssh user@server --redact
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: The "What was checked" section
      description: Copy this section from the terminal output, with any private details removed.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: What went wrong or looked odd
      description: Include any error message. Mention the size of the database if it was slow.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed passwords, API keys, addresses and anything else private.
          required: true

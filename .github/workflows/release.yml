name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: odoo-doctor-linux-x86_64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: odoo-doctor-linux-aarch64, zig: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: odoo-doctor-macos-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: odoo-doctor-macos-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: odoo-doctor-windows-x86_64.exe }
          - { os: ubuntu-latest, target: aarch64-pc-windows-gnullvm, asset: odoo-doctor-windows-aarch64.exe, zig: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          pip3 install --user ziglang
          cargo install cargo-zigbuild --locked
      - name: Build with zig
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect the binary
        shell: bash
        run: |
          mkdir out
          src="target/${{ matrix.target }}/release/odoo-doctor"
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  # Each binary must run on a real machine of its kind before it can be published.
  verify:
    name: verify ${{ matrix.asset }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, asset: odoo-doctor-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: odoo-doctor-linux-aarch64 }
          - { os: macos-15-intel, asset: odoo-doctor-macos-x86_64 }
          - { os: macos-latest, asset: odoo-doctor-macos-aarch64 }
          - { os: windows-latest, asset: odoo-doctor-windows-x86_64.exe }
          - { os: windows-11-arm, asset: odoo-doctor-windows-aarch64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
      - name: Run it
        shell: bash
        run: |
          chmod +x "./${{ matrix.asset }}"
          "./${{ matrix.asset }}" --version
          "./${{ matrix.asset }}" --addons lab/addons --html report.html --no-input
          grep -q lab_broken report.html

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create checksums
        working-directory: assets
        run: sha256sum odoo-doctor-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
